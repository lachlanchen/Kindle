name: Deploy Kindle Book Sender website

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "Handoff/*.pdf"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Add handoff PDFs to the website
        shell: bash
        run: |
          mkdir -p site/downloads
          cp Handoff/kindle-koreader-handoff.pdf site/downloads/
          cp Handoff/kindle-koreader-handoff-zh-CN.pdf site/downloads/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
