# Owner: lazying.art kindle-pw5se-koreader-autostart v2
description "lazying.art reversible KOReader boot launcher"

# KMC/Hotfix uses this same late, one-shot event on this exact firmware. A
# single event avoids the unsatisfiable ordering of the original compound
# expression, while the script still polls bounded, observable readiness.
start on framework_ready
stop on stopping system

# This is deliberately a service, not a task. Upstart therefore does not hold
# the boot event open while KOReader is running. There is no respawn stanza:
# once KOReader exits, the native Kindle UI remains for the rest of this boot.
script
    DISABLE_MARKER="/mnt/us/DISABLE_KOREADER_AUTOSTART"
    STANDARD_MARKER="/mnt/us/_DISABLE_KOREADER_AUTOSTART"
    FRAMEWORK_STOP_MARKER="/mnt/us/_DISABLE_KOREADER_AUTOSTART_FRAMEWORK_STOP"
    AMBIENT_AUTO_MARKER="/mnt/us/ENABLE_AMAZON_AUTO_BRIGHTNESS"
    EMERGENCY_SCRIPT="/mnt/us/emergency.sh"
    KOREADER_LAUNCHER="/mnt/us/koreader/koreader.sh"
    TRACE_TAG="lazying-koreader-autostart"
    TRACE_FILE="/tmp/lazying-koreader-autostart.trace"

    trace() {
        logger -t "${TRACE_TAG}" "$1" >/dev/null 2>&1 || true
        if [ -L "${TRACE_FILE}" ] || { [ -e "${TRACE_FILE}" ] && [ ! -f "${TRACE_FILE}" ]; }; then
            return 0
        fi
        (umask 077; printf '%s\n' "$1" >>"${TRACE_FILE}") 2>/dev/null || true
    }

    marker_kind() {
        marker_path="$1"
        if [ -L "${marker_path}" ]; then
            printf '%s\n' symlink
        elif [ -f "${marker_path}" ]; then
            printf '%s\n' file
        elif [ -d "${marker_path}" ]; then
            printf '%s\n' directory
        elif [ -e "${marker_path}" ]; then
            printf '%s\n' other
        else
            printf '%s\n' absent
        fi
    }

    resolve_mode() {
        active_kind="$(marker_kind "${DISABLE_MARKER}")"
        standard_kind="$(marker_kind "${STANDARD_MARKER}")"
        framework_stop_kind="$(marker_kind "${FRAMEWORK_STOP_MARKER}")"

        for marker_type in "${active_kind}" "${standard_kind}" "${framework_stop_kind}"; do
            case "${marker_type}" in
                absent|file) ;;
                *)
                    printf '%s\n' unsafe_type
                    return 0
                    ;;
            esac
        done

        present=0
        [ "${active_kind}" = file ] && present=$((present + 1))
        [ "${standard_kind}" = file ] && present=$((present + 1))
        [ "${framework_stop_kind}" = file ] && present=$((present + 1))
        if [ "${present}" -ne 1 ]; then
            printf '%s\n' unsafe_count
        elif [ "${active_kind}" = file ]; then
            printf '%s\n' disabled
        elif [ "${standard_kind}" = file ]; then
            printf '%s\n' standard
        else
            printf '%s\n' framework_stop
        fi
    }

    trace "phase=started"

    # Bound the wait to the stock home_wait budget, but poll durable state
    # instead of racing one-shot events. Missing, multiple, or non-regular mode
    # markers fail closed to the native UI.
    ready=0
    remaining=180
    while [ "${remaining}" -gt 0 ]; do
        if grep -q ' /mnt/us ' /proc/mounts; then
            mode="$(resolve_mode)"
            case "${mode}" in
                disabled)
                    trace "phase=disabled"
                    exit 0
                    ;;
                unsafe_*)
                    trace "phase=unsafe-markers state=${mode}"
                    exit 0
                    ;;
            esac
            if [ -e "${EMERGENCY_SCRIPT}" ] || [ -L "${EMERGENCY_SCRIPT}" ]; then
                trace "phase=emergency-blocked"
                exit 0
            fi
            if [ -f "${KOREADER_LAUNCHER}" ] && [ ! -L "${KOREADER_LAUNCHER}" ] && \
                initctl status lab126_gui 2>/dev/null | grep -q 'start/running' && \
                initctl status kppmainapp 2>/dev/null | grep -q 'start/running' && \
                [ -f /tmp/kppmainapp_started ]; then
                ready=1
                break
            fi
        fi
        remaining=$((remaining - 1))
        sleep 1 || exit 0
    done

    if [ "${ready}" -ne 1 ]; then
        trace "phase=readiness-timeout"
        exit 0
    fi
    trace "phase=native-ready"

    # Leave the stock UI usable long enough for a USB recovery marker to be
    # created, then recheck every safety-critical gate immediately before the
    # one launch. A mode change during this window is honored atomically.
    sleep 30 || exit 0
    if ! grep -q ' /mnt/us ' /proc/mounts; then
        trace "phase=final-userstore-missing"
        exit 0
    fi
    mode="$(resolve_mode)"
    case "${mode}" in
        disabled)
            trace "phase=final-disabled"
            exit 0
            ;;
        standard)
            launch_arg="--asap"
            ;;
        framework_stop)
            launch_arg="--framework_stop"
            ;;
        *)
            trace "phase=final-unsafe-markers state=${mode}"
            exit 0
            ;;
    esac
    if [ -e "${EMERGENCY_SCRIPT}" ] || [ -L "${EMERGENCY_SCRIPT}" ]; then
        trace "phase=final-emergency-blocked"
        exit 0
    fi
    if [ ! -f "${KOREADER_LAUNCHER}" ] || [ -L "${KOREADER_LAUNCHER}" ]; then
        trace "phase=final-launcher-invalid"
        exit 0
    fi
    if pidof reader.lua >/dev/null 2>&1; then
        trace "phase=already-running"
        exit 0
    fi

    # Amazon's ambient-light loop otherwise continues underneath KOReader and
    # changes brightness even when KOReader AutoWarmth is disabled. Manual is
    # the default. A regular USB-visible opt-in file explicitly enables it;
    # links and other unsafe types fail closed to manual brightness.
    ambient_auto=0
    if [ -L "${AMBIENT_AUTO_MARKER}" ] || \
        { [ -e "${AMBIENT_AUTO_MARKER}" ] && [ ! -f "${AMBIENT_AUTO_MARKER}" ]; }; then
        trace "phase=ambient-brightness-marker-unsafe"
    elif [ -f "${AMBIENT_AUTO_MARKER}" ]; then
        ambient_auto=1
    fi
    if lipc-set-prop -iq -- com.lab126.powerd flAuto "${ambient_auto}"; then
        trace "phase=ambient-brightness-applied mode=${ambient_auto}"
    else
        trace "phase=ambient-brightness-apply-failed mode=${ambient_auto}"
    fi

    trace "phase=launching mode=${mode}"
    exec /bin/sh "${KOREADER_LAUNCHER}" "${launch_arg}"
end script
